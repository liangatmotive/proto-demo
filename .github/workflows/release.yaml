name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — tag v<version> will be created'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Generate stubs & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing version: ${VERSION} (tag: ${TAG})"

      - name: Create tag (workflow_dispatch only)
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: buf lint
        run: buf lint

      - name: buf generate
        run: buf generate

      - name: Package Go stubs
        run: |
          cd gen/go
          tar czf /tmp/go-stubs-${{ steps.version.outputs.version }}.tar.gz .
          echo "Go stubs packaged:"
          tar tzf /tmp/go-stubs-${{ steps.version.outputs.version }}.tar.gz

      - name: Package Ruby stubs
        run: |
          cd gen/ruby
          tar czf /tmp/ruby-stubs-${{ steps.version.outputs.version }}.tar.gz .
          echo "Ruby stubs packaged:"
          tar tzf /tmp/ruby-stubs-${{ steps.version.outputs.version }}.tar.gz

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -1 || echo "")
          {
            echo "changelog<<EOF"
            if [[ -n "$PREV_TAG" ]]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --oneline "${PREV_TAG}..HEAD" -- proto/ buf.yaml buf.gen.yaml || echo "- Initial release"
            else
              echo "## Initial Release"
              echo ""
              echo "Proto services included:"
              grep "^service " proto/shipping/v1/shipping_service.proto | sed 's/service /- /' | sed 's/ {//'
              echo ""
              echo "RPCs:"
              grep "rpc " proto/shipping/v1/shipping_service.proto | sed 's/^  //' | sed 's/^/- /'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            # proto-demo ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.changelog }}

            ## Artifacts

            | Artifact | Description |
            |----------|-------------|
            | `go-stubs-${{ steps.version.outputs.version }}.tar.gz` | Go protobuf + gRPC stubs |
            | `ruby-stubs-${{ steps.version.outputs.version }}.tar.gz` | Ruby protobuf + gRPC stubs |

            ## Consuming

            **Go:**
            ```bash
            curl -sL https://github.com/liangatmotive/proto-demo/releases/download/${{ steps.version.outputs.tag }}/go-stubs-${{ steps.version.outputs.version }}.tar.gz | tar xz -C gen/go/
            ```

            **Ruby:**
            ```bash
            curl -sL https://github.com/liangatmotive/proto-demo/releases/download/${{ steps.version.outputs.tag }}/ruby-stubs-${{ steps.version.outputs.version }}.tar.gz | tar xz -C lib/proto/
            ```
          files: |
            /tmp/go-stubs-${{ steps.version.outputs.version }}.tar.gz
            /tmp/ruby-stubs-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false

      - name: Upload artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: proto-stubs-${{ steps.version.outputs.version }}
          path: gen/
          retention-days: 90
