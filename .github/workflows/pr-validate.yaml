name: PR Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

  breaking:
    name: buf breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf breaking (against main)
        run: buf breaking --against '.git#branch=main'

  generate-verify:
    name: Generate & verify stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf generate
        run: buf generate

      - name: Show generated files
        run: |
          echo "=== Generated Go stubs ==="
          find gen/go -type f 2>/dev/null | head -20 || echo "(none)"
          echo ""
          echo "=== Generated Ruby stubs ==="
          find gen/ruby -type f 2>/dev/null | head -20 || echo "(none)"

      - name: Upload generated stubs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: generated-stubs-pr-${{ github.event.pull_request.number }}
          path: gen/
          retention-days: 7
